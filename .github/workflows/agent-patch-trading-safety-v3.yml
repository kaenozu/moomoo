name: Agent patch trading safety v3

on:
  push:
    branches: [fix/issues-14-17-trading-safety]
    paths: ['.github/workflows/agent-patch-trading-safety-v3.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/issues-14-17-trading-safety
      - name: Reuse exact v2 patch script
        shell: python
        run: |
          from pathlib import Path
          workflow=Path('.github/workflows/agent-patch-trading-safety-v2.yml').read_text(encoding='utf-8')
          anchor='      - name: Apply exact safety patches\n'
          start=workflow.index('        run: |\n', workflow.index(anchor))+len('        run: |\n')
          end=workflow.index('      - name: Validate and push source only\n', start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(script, '<v2-patch>', 'exec'), {})
      - name: Format validate and push source only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]' ruff pyright
          ruff check --fix src tests
          ruff format tests/test_review_trading_safety.py
          ruff check src tests
          pyright
          pytest -q
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'fix: close critical trading safety gaps'
          git push origin HEAD:fix/issues-14-17-trading-safety
