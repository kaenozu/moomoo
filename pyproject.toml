[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-bot"
version = "0.1.0"
description = "CLI trading bot prototype for Moomoo US paper trading and strategy research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "moomoo-api>=5.11.2307,<11.0.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "rich>=13.7,<15.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "streamlit>=1.44,<3.0",
]
ui = [
  "streamlit>=1.44,<3.0",
]
json-logging = [
  "python-json-logger>=2.0,<4.0",
]

[project.scripts]
moomoo-bot = "moomoo_bot.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
